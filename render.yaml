# Blueprint de Render (Dashboard -> New + -> Blueprint).
# Tambien puedes crear el servicio a mano: Web Service -> Docker -> Plan Free.
services:
  - type: web
    name: trabajos-grado
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: PREFERRED
